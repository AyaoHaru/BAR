<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>莫里安星渊是什么?</title>
  <style>
    :root {
      --neon: #63f8ff;
      --panel-border: rgba(99, 248, 255, 0.35);
      --text: #dffcff;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #08111d 0%, #02040a 50%, #000 100%);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--text);
    }

    .stars {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 6px rgba(255,255,255,0.9), 0 0 12px rgba(99, 248, 255, 0.35);
      animation: twinkle var(--dur) infinite ease-in-out;
      opacity: var(--op);
    }

    @keyframes twinkle {
      0%, 100% { transform: scale(1); opacity: var(--op); }
      50% { transform: scale(1.9); opacity: 1; }
    }

    @keyframes drift {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-20px); }
    }

    .stage {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .jukebox {
      position: relative;
      width: min(92vw, 820px);
      border-radius: 34px;
      padding: 18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)),
        linear-gradient(145deg, rgba(23, 31, 45, 0.95), rgba(5, 8, 15, 0.95));
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 0 0 1px rgba(99,248,255,0.12) inset,
        0 0 30px rgba(99,248,255,0.10),
        0 0 80px rgba(155,123,255,0.08),
        0 20px 80px rgba(0,0,0,0.65);
      overflow: hidden;
      backdrop-filter: blur(6px);
    }

    .jukebox::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent 0%, rgba(255,255,255,0.04) 50%, transparent 100%);
      background-size: 100% 4px;
      mix-blend-mode: screen;
      opacity: 0.12;
      pointer-events: none;
    }

    .jukebox-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 14px 18px;
      color: #b8f9ff;
      text-shadow: 0 0 8px rgba(99,248,255,0.5);
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .badge {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(99,248,255,0.25);
      background: rgba(0, 0, 0, 0.25);
      box-shadow: 0 0 18px rgba(99,248,255,0.15);
    }

    .screen-wrap {
      position: relative;
      border-radius: 26px;
      padding: 18px;
      background:
        radial-gradient(circle at top, rgba(99,248,255,0.18), transparent 55%),
        linear-gradient(180deg, rgba(2, 7, 18, 0.9), rgba(10, 18, 28, 0.95));
      border: 1px solid var(--panel-border);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03) inset,
        0 0 25px rgba(99,248,255,0.15),
        0 0 45px rgba(155,123,255,0.08);
      overflow: hidden;
    }

    .screen {
      min-height: 260px;
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(0,255,255,0.05), rgba(0,0,0,0.18)),
        rgba(0, 8, 16, 0.92);
      border: 1px solid rgba(99,248,255,0.22);
      box-shadow: inset 0 0 35px rgba(99,248,255,0.08), inset 0 0 10px rgba(255,255,255,0.04);
      padding: 22px;
      position: relative;
      overflow: hidden;
    }

    .screen-title {
      font-size: 28px;
      font-weight: 700;
      color: #dffcff;
      text-shadow: 0 0 8px rgba(99,248,255,0.55), 0 0 20px rgba(99,248,255,0.35);
      margin-bottom: 14px;
      letter-spacing: 1px;
    }

    .screen-subtitle {
      font-size: 13px;
      color: rgba(223,252,255,0.72);
      margin-bottom: 18px;
      letter-spacing: 1px;
    }

    .input-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      align-items: center;
    }
    .collect-title {
    margin-top: 14px;
    margin-bottom: 8px;
    font-size: 13px;
    color: rgba(223,252,255,0.7);
    letter-spacing: 1px;
  }

  .collect-box {
    min-height: 56px;
    padding: 12px 14px;
    border-radius: 14px;
    border: 1px solid rgba(99,248,255,0.18);
    background: rgba(0, 8, 16, 0.65);
    color: #dffcff;
    box-shadow: inset 0 0 18px rgba(99,248,255,0.05);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .collect-item {
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid rgba(99,248,255,0.28);
    background: rgba(99,248,255,0.08);
    text-shadow: 0 0 6px rgba(99,248,255,0.25);
    font-size: 13px;
  }

    .neon-input {
      flex: 1;
      min-width: 240px;
      border: 1px solid rgba(99,248,255,0.35);
      outline: none;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(10, 20, 35, 0.95), rgba(0, 10, 18, 0.95));
      color: #e8feff;
      padding: 14px 16px;
      font-size: 18px;
      box-shadow:
        0 0 0 1px rgba(155,123,255,0.10) inset,
        0 0 18px rgba(99,248,255,0.12),
        inset 0 0 18px rgba(99,248,255,0.05);
      text-shadow: 0 0 6px rgba(99,248,255,0.35);
      caret-color: var(--neon);
    }

    .neon-input::placeholder {
      color: rgba(151, 230, 255, 0.45);
    }

    .neon-input:focus {
      border-color: rgba(99,248,255,0.7);
      box-shadow:
        0 0 0 1px rgba(99,248,255,0.15) inset,
        0 0 18px rgba(99,248,255,0.22),
        0 0 34px rgba(99,248,255,0.10),
        inset 0 0 22px rgba(99,248,255,0.08);
    }

    .btn {
      padding: 13px 20px;
      border: 1px solid rgba(99,248,255,0.35);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(99,248,255,0.18), rgba(99,248,255,0.08));
      color: #dffcff;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(99,248,255,0.15), inset 0 0 12px rgba(255,255,255,0.05);
      text-shadow: 0 0 6px rgba(99,248,255,0.45);
      transition: transform 0.08s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .dialogue {
      min-height: 150px;
      border-radius: 16px;
      padding: 28px 18px 18px;
      background: linear-gradient(180deg, rgba(0, 255, 255, 0.04), rgba(0, 0, 0, 0.12));
      border: 1px solid rgba(99,248,255,0.18);
      color: #e8feff;
      font-size: 18px;
      line-height: 1.9;
      text-shadow: 0 0 6px rgba(99,248,255,0.2);
      box-shadow: inset 0 0 18px rgba(99,248,255,0.05);
      white-space: pre-wrap;
      position: relative;
    }

    .dialogue::before {
      content: "DIALOG";
      position: absolute;
      top: 10px;
      right: 14px;
      font-size: 12px;
      letter-spacing: 2px;
      color: rgba(99,248,255,0.35);
    }

    .audio-status {
      margin-top: 8px;
      font-size: 12px;
      color: rgba(223,252,255,0.58);
      letter-spacing: 1px;
      min-height: 18px;   /* 固定高度，防止排版跳动 */
      visibility: visible; /* 始终占位 */
    }

    .cursor {
      display: inline-block;
      margin-left: 2px;
      animation: blink 1s step-start infinite;
      color: var(--neon);
      text-shadow: 0 0 8px rgba(99,248,255,0.6);
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .lights {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .light {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #63f8ff;
      box-shadow: 0 0 8px #63f8ff, 0 0 18px #63f8ff;
      opacity: 0.75;
      animation: pulse 1.8s infinite ease-in-out;
    }
    .light:nth-child(2) { background: #9b7bff; box-shadow: 0 0 8px #9b7bff, 0 0 18px #9b7bff; animation-delay: .3s; }
    .light:nth-child(3) { background: #ff7de9; box-shadow: 0 0 8px #ff7de9, 0 0 18px #ff7de9; animation-delay: .6s; }
    .light:nth-child(4) { background: #7dff9d; box-shadow: 0 0 8px #7dff9d, 0 0 18px #7dff9d; animation-delay: .9s; }

    @keyframes pulse {
      0%, 100% { transform: scale(0.9); opacity: 0.55; }
      50% { transform: scale(1.15); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="stage">
    <div class="jukebox">
      <div class="jukebox-top">
        <div class="badge">终极问题 / THE ULTIMATE QUESTION</div>
        <div class="badge">MORIAN ABYSS IS -?</div>
      </div>

      <div class="screen-wrap">
        <div class="screen">
          <div class="screen-title">莫里安星渊是什么？</div>
          <div class="screen-subtitle">
            输入你的答案，或者随便什么词，就当和点歌机聊聊天……
          </div>

          <div class="input-row">
            <input id="userInput" class="neon-input" type="text" placeholder="输入后投币，或按回车..." />
            <button id="submitBtn" class="btn">投币</button>
          </div>

          <div id="dialogue" class="dialogue">你期待着解谜吗? <br>可惜，最后的谜题只是一个简简单单的问答游戏——"莫里安星渊"是什么？<br>告诉我你的答案吧！</div>
          <div id="audioStatus" class="audio-status">暂时无音频播放</div>

          <div class="collect-title">已输入答案</div>
          <div id="collectBox" class="collect-box"></div>

          <div class="lights">
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
            <span class="light"></span>
          </div>

          <div class="hint" style="margin-top:14px;font-size:13px;color:rgba(223,252,255,0.62);letter-spacing:1px;">
            提示：点歌机能够识别单个中文词语或英文单词，大小写不限。
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 音频元素 -->
  <audio id="tapeAudio" src="tape.wav" preload="auto"></audio>
  <audio id="specialAudio" src="us.mp3" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
